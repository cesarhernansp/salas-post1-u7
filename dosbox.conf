# dosbox.conf -- Laboratorio Post1 Unidad 7
# Se coloca en la raiz del proyecto y se inicia con: dosbox.exe -conf dosbox.conf

[cpu]
core=normal
cputype=auto
# la velocidad no afecta a estos programas
cycles=max

[autoexec]
# Montar el directorio del proyecto como unidad C:
mount c "C:\Users\Cesar\salas-post1-u7"
c:
# nasm.exe y cwsdpmi.exe viven en la raiz del proyecto
path %PATH%;C:\
# nasm.exe (DJGPP) necesita un host DPMI residente
cwsdpmi -p > nul
cls
